<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula03 - HTML</title>
  </head>
  <body>

    <h3>Atributos em HTML</h3>

    <p>Utilizando o atributo href:</p>

    <a href="https://www.spotify.com">Clique aqui</a>

    <hr>

    <p>Utilizando os atributos src, width, height e alt:</p>

    <img src="carro-senna.png" width="400" height="225" alt="MP4/5B do Ayrton Senna">

    <hr>

    <p>Utilizando o atributo style:</p>

    <p style="color: orangered;">Esse texto é laranja</p>
    


  </body>
</html>
