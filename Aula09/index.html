<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula09 - HTML</title>
  </head>
  <body>
    
    <h1>Imagens em HTML</h1>

    <img src="carro-senna.png" alt="McLaren MP4/5B" width="300" height="170">

    <hr>

    <h3>Alterando tamanho de imagem com o CSS</h3>

    <img src="carro-senna.png" alt="McLaren MP4/5B" style="width: 250px; height: 140px;">

    <hr>

    <h3>Definindo imagens localizadas em outra pasta</h3>

    <img src="/Aula09/img/gato-voador.gif" alt="Nyan Cat" style="width: 250px; height: 140px;">

    <hr>

    <h3>Definindo imagens dinâmicas no HTML (gif)</h3>

    <img src="/Aula09/img/programming.gif" alt="Homem no Cumputador" style="width: 100px; height: 100px;">

    <hr>

    <h3>Imagens flutuantes no HTML</h3>

    <p>
      <img src="/Aula09/img/programming.gif" style="float: right;">
      Somente a dor coletiva gera união.
    </p>

  </body>
</html>
